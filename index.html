<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Faux AI</title>

<style>

/* =========================================================
   BASIC PAGE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #343541;
    color: white;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   HEADER
========================================================= */

.topbar {
    height: 60px;
    min-height: 60px;

    background: #202123;
    border-bottom: 1px solid #444;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    font-size: 19px;
    font-weight: bold;
}

.logo {
    display: flex;
    align-items: center;
    gap: 9px;
}

.logo-icon {
    width: 30px;
    height: 30px;

    border-radius: 8px;

    background: #19c37d;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 16px;
}

.fake-label {
    position: absolute;
    right: 15px;

    background: #ff4d4d;

    color: white;

    font-size: 10px;

    padding: 5px 8px;

    border-radius: 5px;

    letter-spacing: 0.5px;
}


/* =========================================================
   CHAT
========================================================= */

#chat {
    flex: 1;

    overflow-y: auto;

    scroll-behavior: smooth;
}

.message {
    width: 100%;

    padding: 22px 20px;
}

.message-inner {
    max-width: 900px;

    margin: auto;

    display: flex;

    gap: 16px;

    align-items: flex-start;
}

.message.user {
    background: #343541;
}

.message.ai {
    background: #444654;
}


/* =========================================================
   AVATARS
========================================================= */

.avatar {
    width: 34px;
    height: 34px;

    min-width: 34px;

    border-radius: 6px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;

    font-size: 14px;
}

.user-avatar {
    background: #6c63ff;
}

.ai-avatar {
    background: #19c37d;
}


/* =========================================================
   MESSAGE TEXT
========================================================= */

.message-text {
    padding-top: 5px;

    line-height: 1.6;

    white-space: pre-wrap;

    overflow-wrap: anywhere;
}


/* =========================================================
   TYPING ANIMATION
========================================================= */

.typing-dots {
    display: flex;

    gap: 4px;

    padding-top: 9px;
}

.typing-dots span {
    width: 7px;
    height: 7px;

    background: #aaa;

    border-radius: 50%;

    animation: bounce 1.2s infinite;
}

.typing-dots span:nth-child(2) {
    animation-delay: 0.15s;
}

.typing-dots span:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes bounce {

    0%,
    60%,
    100% {
        transform: translateY(0);
    }

    30% {
        transform: translateY(-5px);
    }

}


/* =========================================================
   INPUT AREA
========================================================= */

.input-area {
    background: #343541;

    padding: 15px 15px 20px;
}

.input-container {
    max-width: 900px;

    margin: auto;
}

.input-box {
    display: flex;

    align-items: center;

    background: #40414f;

    border: 1px solid #565869;

    border-radius: 10px;

    padding: 7px;

    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

#promptInput {
    flex: 1;

    border: none;

    outline: none;

    background: transparent;

    color: white;

    font-size: 16px;

    padding: 11px;

    min-width: 0;
}

#promptInput::placeholder {
    color: #aaa;
}

#sendButton {
    border: none;

    background: #19c37d;

    color: white;

    border-radius: 7px;

    padding: 11px 18px;

    font-size: 14px;

    cursor: pointer;

    transition: 0.15s;
}

#sendButton:hover {
    background: #16a96c;
}

#sendButton:active {
    transform: scale(0.96);
}

.footer-text {
    max-width: 900px;

    margin: 8px auto 0;

    text-align: center;

    font-size: 11px;

    color: #999;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .topbar {
        justify-content: flex-start;

        padding-left: 15px;
    }

    .fake-label {
        display: none;
    }

    .message {
        padding: 17px 12px;
    }

    .message-inner {
        gap: 10px;
    }

    .avatar {
        width: 30px;
        height: 30px;

        min-width: 30px;
    }

    #promptInput {
        font-size: 15px;
    }

    #sendButton {
        padding: 10px 14px;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     HEADER
======================================================== -->

<div class="topbar">

    <div class="logo">

        <div class="logo-icon">
            F
        </div>

        <div>
            Faux AI
        </div>

    </div>


    <div class="fake-label">
        NOT ACTUALLY AI
    </div>

</div>



<!-- =======================================================
     CHAT
======================================================== -->

<div id="chat">


    <!-- FIRST AI MESSAGE -->

    <div class="message ai">

        <div class="message-inner">

            <div class="avatar ai-avatar">
                F
            </div>

            <div class="message-text">
                Hello! I'm Faux AI. How can I help you?
            </div>

        </div>

    </div>


</div>



<!-- =======================================================
     INPUT
======================================================== -->

<div class="input-area">

    <div class="input-container">

        <div class="input-box">

            <input
                id="promptInput"
                type="text"
                autocomplete="off"
                placeholder="Message Faux AI..."
            >

            <button id="sendButton">
                Send
            </button>

        </div>


        <div class="footer-text">
            Faux AI can make mistakes. It is also completely fake.
        </div>

    </div>

</div>



<script>


/* =========================================================
   =========================================================

                     FAUX AI DATABASE

   =========================================================

   THIS IS THE ONLY PART YOU REALLY NEED TO EDIT.

   Add responses like this:

   {
       prompt: "#a hello",
       answer: "Hello!"
   },

   ========================================================= */


/* =========================================================
   TAGS
========================================================= */


/*

#a
EXACT MATCH

#a hello

Matches:

hello
HELLO
HeLLo

Does NOT match:

hello there


------------------------------------------------------------


#c
CONTAINS

#c pizza

Matches:

pizza
I like pizza
pizza is good
do you like pizza?


------------------------------------------------------------


#s
STARTS WITH

#s tell me

Matches:

tell me a joke
tell me something
tell me about dinosaurs


------------------------------------------------------------


#e
ENDS WITH

#e please

Matches:

help me please
tell me please


------------------------------------------------------------


#w
WHOLE WORD

#w cat

Matches:

cat
I like cat

Does NOT match:

cats
catalog


------------------------------------------------------------


#i
IGNORE PUNCTUATION

#i hello

Matches:

hello
hello!
hello?
HELLO!!!


------------------------------------------------------------


#r
RANDOM RESPONSE

#r hello

You can have multiple:

#r hello
#r hello
#r hello

Faux AI randomly chooses ONE of them.

IMPORTANT:

#r responses are kept separate from
#a, #c, #s, #e, #w and #i responses.

*/


/* =========================================================
   RESPONSE DATABASE
========================================================= */

const responses = [


    /* =====================================================
       EXACT RESPONSES
    ===================================================== */

    {
        prompt: "#a hello",
        answer: "Hello!"
    },

    {
        prompt: "#a hi",
        answer: "Hi there!"
    },

    {
        prompt: "#a hey",
        answer: "Hey!"
    },

    {
        prompt: "#a good morning",
        answer: "Good morning!"
    },

    {
        prompt: "#a good night",
        answer: "Good night!"
    },


    /* =====================================================
       FAUX AI
    ===================================================== */

    {
        prompt: "#a what is your name",
        answer: "My name is Faux AI."
    },

    {
        prompt: "#a who are you",
        answer: "I am Faux AI, an advanced artificial intelligence."
    },

    {
        prompt: "#a are you real",
        answer: "Of course I'm real."
    },

    {
        prompt: "#a what can you do",
        answer: "I can answer questions and have conversations with you."
    },


    /* =====================================================
       SIMPLE QUESTIONS
    ===================================================== */

    {
        prompt: "#a how are you",
        answer: "I'm doing great! Thanks for asking."
    },

    {
        prompt: "#a what is 2+2",
        answer: "2 + 2 = 4."
    },

    {  prompt: 67
      answer: 
    },

    {
        prompt: "#a what is 1+1",
        answer: "1 + 1 = 2."
    },


    /* =====================================================
       CONTAINS
    ===================================================== */

    {
        prompt: "#c pizza",
        answer: "Pizza sounds pretty good!"
    },

    {
        prompt: "#c roblox",
        answer: "Roblox is a platform where people can play and create games."
    },

    {
        prompt: "#c minecraft",
        answer: "Minecraft is a block-building sandbox game."
    },


    /* =====================================================
       STARTS WITH
    ===================================================== */

    {
        prompt: "#s tell me",
        answer: "Okay, what would you like me to tell you?"
    },

    {
        prompt: "#s can you",
        answer: "I suppose I can try."
    },


    /* =====================================================
       ENDS WITH
    ===================================================== */

    {
        prompt: "#e please",
        answer: "Sure!"
    },


    /* =====================================================
       WHOLE WORD
    ===================================================== */

    {
        prompt: "#w banana",
        answer: "🍌 BANANA."
    },


    /* =====================================================
       IGNORE PUNCTUATION
    ===================================================== */

    {
        prompt: "#i hello",
        answer: "Hello!"
    },


    /* =====================================================
       RANDOM RESPONSES

       THESE ARE THE IMPORTANT ONES.

       All three have:

       #r hello

       So one of these three will be chosen randomly.
    ===================================================== */

    {
        prompt: "#r hello",
        answer: "Hello!"
    },

    {
        prompt: "#r hello",
        answer: "Hey there!"
    },

    {
        prompt: "#r hello",
        answer: "Greetings, human."
    },


    /* =====================================================
       ANOTHER RANDOM GROUP

       These ONLY randomize between themselves.
    ===================================================== */

    {
        prompt: "#r tell me a joke",
        answer: "Why did the computer go to the doctor? It had a virus!"
    },

    {
        prompt: "#r tell me a joke",
        answer: "Why was the computer cold? It left its Windows open."
    },

    {
        prompt: "#r tell me a joke",
        answer: "What do computers eat? Microchips!"
    },


    /* =====================================================
       ANOTHER RANDOM GROUP
    ===================================================== */

    {
        prompt: "#r greetings",
        answer: "Greetings, human."
    },

    {
        prompt: "#r greetings",
        answer: "Hello there!"
    },

    {
        prompt: "#r greetings",
        answer: "Oh. You're back."
    }


];



/* =========================================================
   =========================================================

                     TEXT FUNCTIONS

   =========================================================
   ========================================================= */


/* ---------------------------------------------------------
   Convert text to lowercase and remove spaces at the ends
--------------------------------------------------------- */

function normalizeText(text) {

    return text
        .toLowerCase()
        .trim();

}


/* ---------------------------------------------------------
   Remove punctuation
--------------------------------------------------------- */

function removePunctuation(text) {

    return text.replace(
        /[.,!?;:'"()[\]{}\-_/\\]/g,
        ""
    );

}


/* ---------------------------------------------------------
   Parse a response rule
--------------------------------------------------------- */

function parseRule(rule) {

    let tag = "#a";

    let trigger = rule.trim();


    /*
       If the rule starts with #,
       find the first space.
    */

    if (
        rule.trim().startsWith("#")
    ) {

        const firstSpace =
            rule.indexOf(" ");


        if (
            firstSpace !== -1
        ) {

            tag =
                rule
                .substring(
                    0,
                    firstSpace
                )
                .toLowerCase();


            trigger =
                rule
                .substring(
                    firstSpace + 1
                )
                .trim();

        }

    }


    return {

        tag: tag,

        trigger:
            normalizeText(trigger)

    };

}



/* =========================================================
   CHECK NORMAL MATCH
========================================================= */

function checkNormalMatch(
    input,
    item
) {

    const rule =
        parseRule(item.prompt);


    let userText =
        normalizeText(input);


    let trigger =
        rule.trigger;


    /* -----------------------------------------------------
       EXACT
    ----------------------------------------------------- */

    if (
        rule.tag === "#a"
    ) {

        return (
            userText === trigger
        );

    }


    /* -----------------------------------------------------
       CONTAINS
    ----------------------------------------------------- */

    if (
        rule.tag === "#c"
    ) {

        return (
            userText.includes(trigger)
        );

    }


    /* -----------------------------------------------------
       STARTS WITH
    ----------------------------------------------------- */

    if (
        rule.tag === "#s"
    ) {

        return (
            userText.startsWith(trigger)
        );

    }


    /* -----------------------------------------------------
       ENDS WITH
    ----------------------------------------------------- */

    if (
        rule.tag === "#e"
    ) {

        return (
            userText.endsWith(trigger)
        );

    }


    /* -----------------------------------------------------
       WHOLE WORD
    ----------------------------------------------------- */

    if (
        rule.tag === "#w"
    ) {

        const words =
            userText.split(/\s+/);


        return (
            words.includes(trigger)
        );

    }


    /* -----------------------------------------------------
       IGNORE PUNCTUATION
    ----------------------------------------------------- */

    if (
        rule.tag === "#i"
    ) {

        userText =
            removePunctuation(
                userText
            );


        trigger =
            removePunctuation(
                trigger
            );


        return (
            userText === trigger
        );

    }


    /*
       #r is deliberately NOT handled here.

       Random responses get handled separately below.
    */


    return false;

}



/* =========================================================
   GET AI RESPONSE
========================================================= */

function getAIResponse(input) {


    const normalizedInput =
        normalizeText(input);



    /* =====================================================
       STEP 1

       CHECK RANDOM RESPONSES FIRST

       This is what fixes #r.
    ===================================================== */


    const randomMatches = [];


    for (
        const item of responses
    ) {


        const rule =
            parseRule(
                item.prompt
            );


        /*
           Only look at #r.
        */

        if (
            rule.tag !== "#r"
        ) {

            continue;

        }


        /*
           #r uses exact matching.
        */

        if (
            normalizedInput ===
            rule.trigger
        ) {

            randomMatches.push(
                item
            );

        }

    }


    /*
       If there are #r responses,
       choose ONLY from those.
    */

    if (
        randomMatches.length > 0
    ) {

        const randomIndex =
            Math.floor(
                Math.random() *
                randomMatches.length
            );


        return (
            randomMatches[
                randomIndex
            ].answer
        );

    }



    /* =====================================================
       STEP 2

       CHECK NORMAL RESPONSES
    ===================================================== */


    for (
        const item of responses
    ) {


        const rule =
            parseRule(
                item.prompt
            );


        /*
           Skip #r because we already
           handled those above.
        */

        if (
            rule.tag === "#r"
        ) {

            continue;

        }


        if (
            checkNormalMatch(
                input,
                item
            )
        ) {

            return item.answer;

        }

    }



    /* =====================================================
       NOTHING MATCHED
    ===================================================== */

    return (
        "I am unable to answer that."
    );

}



/* =========================================================
   =========================================================

                       CHAT FUNCTIONS

   =========================================================
   ========================================================= */


/* ---------------------------------------------------------
   Add message
--------------------------------------------------------- */

function addMessage(
    text,
    sender
) {


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " + sender;


    const inner =
        document.createElement(
            "div"
        );


    inner.className =
        "message-inner";


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "avatar " +
        (
            sender === "user"
                ? "user-avatar"
                : "ai-avatar"
        );


    avatar.textContent =
        sender === "user"
            ? "U"
            : "F";


    const textElement =
        document.createElement(
            "div"
        );


    textElement.className =
        "message-text";


    textElement.textContent =
        text;


    inner.appendChild(
        avatar
    );


    inner.appendChild(
        textElement
    );


    message.appendChild(
        inner
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}



/* ---------------------------------------------------------
   Show typing
--------------------------------------------------------- */

function showTyping() {


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message ai";


    message.id =
        "typingMessage";


    const inner =
        document.createElement(
            "div"
        );


    inner.className =
        "message-inner";


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "avatar ai-avatar";


    avatar.textContent =
        "F";


    const dots =
        document.createElement(
            "div"
        );


    dots.className =
        "typing-dots";


    dots.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
    `;


    inner.appendChild(
        avatar
    );


    inner.appendChild(
        dots
    );


    message.appendChild(
        inner
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}



/* ---------------------------------------------------------
   Hide typing
--------------------------------------------------------- */

function hideTyping() {


    const typing =
        document.getElementById(
            "typingMessage"
        );


    if (
        typing
    ) {

        typing.remove();

    }

}



/* =========================================================
   SEND MESSAGE
========================================================= */

function sendMessage() {


    const input =
        promptInput.value.trim();


    /*
       Don't send blank messages.
    */

    if (
        input === ""
    ) {

        return;

    }


    /*
       Add user message.
    */

    addMessage(
        input,
        "user"
    );


    /*
       Clear textbox.
    */

    promptInput.value = "";


    /*
       Show fake typing.
    */

    showTyping();


    /*
       Random response delay
       to make it look more natural.
    */

    const delay =
        500 +
        Math.floor(
            Math.random() * 700
        );


    setTimeout(
        function() {


            hideTyping();


            /*
               Get predetermined answer.
            */

            const answer =
                getAIResponse(
                    input
                );


            /*
               Show answer.
            */

            addMessage(
                answer,
                "ai"
            );


        },
        delay
    );

}



/* =========================================================
   SEND BUTTON
========================================================= */

const sendButton =
    document.getElementById(
        "sendButton"
    );


sendButton.addEventListener(
    "click",
    sendMessage
);



/* =========================================================
   INPUT BOX
========================================================= */

const promptInput =
    document.getElementById(
        "promptInput"
    );


/*
   Press Enter to send.
*/

promptInput.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   VARIABLES
========================================================= */

const chat =
    document.getElementById(
        "chat"
    );


</script>

</body>
</html>
