<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Faux AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #343541;
    color: white;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   HEADER
========================================================= */

.topbar {
    height: 60px;
    min-height: 60px;

    background: #202123;
    border-bottom: 1px solid #444;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    font-size: 19px;
    font-weight: bold;
}

.logo {
    display: flex;
    align-items: center;
    gap: 9px;
}

.logo-icon {
    width: 30px;
    height: 30px;

    border-radius: 8px;

    background: #19c37d;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 16px;
}

.fake-label {
    position: absolute;

    right: 15px;

    background: #ff4d4d;

    color: white;

    font-size: 10px;

    padding: 5px 8px;

    border-radius: 5px;

    letter-spacing: 0.5px;
}


/* =========================================================
   CHAT
========================================================= */

#chat {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
}

.message {
    width: 100%;
    padding: 22px 20px;
}

.message-inner {
    max-width: 900px;
    margin: auto;

    display: flex;
    gap: 16px;

    align-items: flex-start;
}

.message.user {
    background: #343541;
}

.message.ai {
    background: #444654;
}


/* =========================================================
   AVATARS
========================================================= */

.avatar {
    width: 34px;
    height: 34px;
    min-width: 34px;

    border-radius: 6px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
    font-size: 14px;
}

.user-avatar {
    background: #6c63ff;
}

.ai-avatar {
    background: #19c37d;
}


/* =========================================================
   MESSAGE TEXT
========================================================= */

.message-text {
    padding-top: 5px;

    line-height: 1.6;

    white-space: pre-wrap;
    overflow-wrap: anywhere;
}


/* =========================================================
   TYPING ANIMATION
========================================================= */

.typing-dots {
    display: flex;
    gap: 4px;
    padding-top: 9px;
}

.typing-dots span {
    width: 7px;
    height: 7px;

    background: #aaa;

    border-radius: 50%;

    animation: bounce 1.2s infinite;
}

.typing-dots span:nth-child(2) {
    animation-delay: 0.15s;
}

.typing-dots span:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes bounce {

    0%,
    60%,
    100% {
        transform: translateY(0);
    }

    30% {
        transform: translateY(-5px);
    }

}


/* =========================================================
   INPUT
========================================================= */

.input-area {
    background: #343541;
    padding: 15px 15px 20px;
}

.input-container {
    max-width: 900px;
    margin: auto;
}

.input-box {
    display: flex;
    align-items: center;

    background: #40414f;

    border: 1px solid #565869;

    border-radius: 10px;

    padding: 7px;
}

#promptInput {
    flex: 1;

    border: none;
    outline: none;

    background: transparent;

    color: white;

    font-size: 16px;

    padding: 11px;

    min-width: 0;
}

#promptInput::placeholder {
    color: #aaa;
}

#sendButton {
    border: none;

    background: #19c37d;

    color: white;

    border-radius: 7px;

    padding: 11px 18px;

    font-size: 14px;

    cursor: pointer;
}

#sendButton:hover {
    background: #16a96c;
}

#sendButton:active {
    transform: scale(0.96);
}

.footer-text {
    max-width: 900px;

    margin: 8px auto 0;

    text-align: center;

    font-size: 11px;

    color: #999;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .topbar {
        justify-content: flex-start;
        padding-left: 15px;
    }

    .fake-label {
        display: none;
    }

    .message {
        padding: 17px 12px;
    }

    .message-inner {
        gap: 10px;
    }

    .avatar {
        width: 30px;
        height: 30px;
        min-width: 30px;
    }

    #promptInput {
        font-size: 15px;
    }

    #sendButton {
        padding: 10px 14px;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<div class="topbar">

    <div class="logo">

        <div class="logo-icon">
            F
        </div>

        <div>
            Faux AI
        </div>

    </div>

    <div class="fake-label">
        NOT ACTUALLY AI
    </div>

</div>



<!-- =======================================================
     CHAT
======================================================= -->

<div id="chat">

    <div class="message ai">

        <div class="message-inner">

            <div class="avatar ai-avatar">
                F
            </div>

            <div class="message-text">
                Hello! I'm Faux AI. How can I help you?
            </div>

        </div>

    </div>

</div>



<!-- =======================================================
     INPUT
======================================================= -->

<div class="input-area">

    <div class="input-container">

        <div class="input-box">

            <input
                id="promptInput"
                type="text"
                autocomplete="off"
                placeholder="Message Faux AI..."
            >

            <button id="sendButton">
                Send
            </button>

        </div>

        <div class="footer-text">
            Faux AI can make mistakes. It is also completely fake.
        </div>

    </div>

</div>



<script>


/* =========================================================
   RESPONSE DATABASE
   ========================================================= */

const responses = [];


/* =========================================================
   EASY RESPONSE FUNCTION
   =========================================================

   FORMAT:

   add("TAG", "PROMPT", "ANSWER");

   ========================================================= */


/* =========================================================
   EXAMPLE RESPONSES
========================================================= */

add("#a", "hello", "Hello!");

add("#a", "hi", "Hi there!");

add("#a", "hey", "Hey!");

add("#a", "how are you", "I'm doing great! Thanks for asking!");

add("#a", "what is your name", "My name is Faux AI.");

add("#a", "who are you", "I am Faux AI.");

add("#a", "are you real", "Of course I'm real.");

add("#a", "what is 2+2", "2 + 2 = 4.");

add("#a", "good morning", "Good morning!");

add("#a", "good night", "Good night!");


/* =========================================================
   CONTAINS
========================================================= */

add(
    "#c",
    "roblox",
    "Roblox is a platform where people can play and create games."
);

add(
    "#c",
    "minecraft",
    "Minecraft is a block-building sandbox game."
);

add(
    "#c",
    "pizza",
    "Pizza sounds pretty good!"
);


/* =========================================================
   STARTS WITH
========================================================= */

add(
    "#s",
    "tell me",
    "Okay! What would you like me to tell you?"
);

add(
    "#s",
    "can you",
    "I'll try my best."
);


/* =========================================================
   ENDS WITH
========================================================= */

add(
    "#e",
    "please",
    "Sure!"
);


/* =========================================================
   WHOLE WORD
========================================================= */

add(
    "#w",
    "banana",
    "🍌 BANANA."
);


/* =========================================================
   IGNORE PUNCTUATION
========================================================= */

add(
    "#i",
    "hello",
    "Hello!"
);


/* =========================================================
   RANDOM RESPONSES
=========================================================

   Multiple responses with the same prompt
   will randomly choose one.

========================================================= */

add(
    "#r",
    "hello there",
    "Hello there!"
);

add(
    "#r",
    "hello there",
    "Hey there!"
);

add(
    "#r",
    "hello there",
    "Greetings, human."
);


/* =========================================================
   RANDOM JOKES
========================================================= */

add(
    "#r",
    "tell me a joke",
    "Why did the computer go to the doctor? It had a virus!"
);

add(
    "#r",
    "tell me a joke",
    "Why was the computer cold? It left its Windows open."
);

add(
    "#r",
    "tell me a joke",
    "What do computers eat? Microchips!"
);


/* =========================================================
   =========================================================
   ADD YOUR OWN RESPONSES HERE
   =========================================================
   
   Just copy this:

   add("#a", "YOUR PROMPT", "YOUR ANSWER");

   Example:

   add("#a", "what is fortnite", "Fortnite is a game.");

   ========================================================= */



add("#a", "what is roblox", "Roblox is a gaming platform.");

add("#a", "what is your favorite game", "I don't have a favorite game.");

add("#c", "dinosaurs", "Dinosaurs lived millions of years ago.");
add("#i", "What's Faux AI In English", "I'd Rather Not Say That.");
add("#s", "why", "Because that's how it works.");
add("#a", "Message Faux AI...", "Technically that's a message.");
add("#r", "hello", "Hello!");
add("#r", "hello", "Hey!");
add("#a", "⠀", "⠀⠀⠀⠀");
add("#r", "hello", "Greetings!");
add("#c", "67", "6️⃣7️⃣ !");
add("#a", "Hello! I'm Faux AI. How can I help you?", "Stop Copying me, please.");
add("#a", "Stop Copying me, please.", "ashioufludhaidliog");   
add("#a", "ashioufludhaidliog", "Faux AI is completely real and im the #1 supporter!");
add("#a", "Faux AI is completely real and im the #1 supporter!", "⠀");


/* =========================================================
   EASY ADD FUNCTION
========================================================= */

function add(tag, prompt, answer) {

    responses.push({

        tag: String(tag)
            .toLowerCase()
            .trim(),

        prompt: String(prompt)
            .toLowerCase()
            .trim(),

        answer: String(answer)

    });

}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalize(text) {

    return String(text)
        .toLowerCase()
        .trim();

}


/* =========================================================
   REMOVE PUNCTUATION
========================================================= */

function removePunctuation(text) {

    return text.replace(
        /[.,!?;:'"()[\]{}\-_/\\]/g,
        ""
    );

}


/* =========================================================
   CHECK NORMAL RESPONSE
========================================================= */

function matches(input, response) {

    let userText =
        normalize(input);

    let trigger =
        response.prompt;


    /* =====================================================
       #a = EXACT
    ===================================================== */

    if (response.tag === "#a") {

        return userText === trigger;

    }


    /* =====================================================
       #c = CONTAINS
    ===================================================== */

    if (response.tag === "#c") {

        return userText.includes(trigger);

    }


    /* =====================================================
       #s = STARTS WITH
    ===================================================== */

    if (response.tag === "#s") {

        return userText.startsWith(trigger);

    }


    /* =====================================================
       #e = ENDS WITH
    ===================================================== */

    if (response.tag === "#e") {

        return userText.endsWith(trigger);

    }


    /* =====================================================
       #w = WHOLE WORD
    ===================================================== */

    if (response.tag === "#w") {

        const words =
            userText.split(/\s+/);

        return words.includes(trigger);

    }


    /* =====================================================
       #i = IGNORE PUNCTUATION
    ===================================================== */

    if (response.tag === "#i") {

        userText =
            removePunctuation(userText);

        trigger =
            removePunctuation(trigger);

        return userText === trigger;

    }


    return false;

}


/* =========================================================
   GET RESPONSE
========================================================= */

function getResponse(input) {


    /* =====================================================
       RANDOM RESPONSES
    ===================================================== */

    const randomMatches = [];

    const normalizedInput =
        normalize(input);


    for (
        const response of responses
    ) {

        /*
           Only look at #r responses.
        */

        if (
            response.tag !== "#r"
        ) {
            continue;
        }


        /*
           #r uses exact matching.
        */

        if (
            normalizedInput ===
            response.prompt
        ) {

            randomMatches.push(
                response
            );

        }

    }


    /*
       If random responses exist,
       randomly select one.
    */

    if (
        randomMatches.length > 0
    ) {

        const randomIndex =
            Math.floor(
                Math.random() *
                randomMatches.length
            );

        return (
            randomMatches[randomIndex]
                .answer
        );

    }


    /* =====================================================
       NORMAL RESPONSES
    ===================================================== */

    for (
        const response of responses
    ) {

        /*
           Skip random responses,
           because they were checked above.
        */

        if (
            response.tag === "#r"
        ) {
            continue;
        }


        if (
            matches(
                input,
                response
            )
        ) {

            return response.answer;

        }

    }


    /* =====================================================
       NO MATCH
    ===================================================== */

    return "I am unable to answer that.";

}


/* =========================================================
   ADD CHAT MESSAGE
========================================================= */

function addMessage(
    text,
    sender
) {

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " + sender;


    const inner =
        document.createElement(
            "div"
        );

    inner.className =
        "message-inner";


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar " +
        (
            sender === "user"
            ? "user-avatar"
            : "ai-avatar"
        );


    avatar.textContent =
        sender === "user"
        ? "U"
        : "F";


    const textElement =
        document.createElement(
            "div"
        );

    textElement.className =
        "message-text";


    textElement.textContent =
        text;


    inner.appendChild(
        avatar
    );

    inner.appendChild(
        textElement
    );


    message.appendChild(
        inner
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================================
   SHOW TYPING
========================================================= */

function showTyping() {

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message ai";

    message.id =
        "typingMessage";


    const inner =
        document.createElement(
            "div"
        );

    inner.className =
        "message-inner";


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar ai-avatar";

    avatar.textContent =
        "F";


    const dots =
        document.createElement(
            "div"
        );

    dots.className =
        "typing-dots";


    dots.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
    `;


    inner.appendChild(
        avatar
    );

    inner.appendChild(
        dots
    );


    message.appendChild(
        inner
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================================
   HIDE TYPING
========================================================= */

function hideTyping() {

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if (typing) {
        typing.remove();
    }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

function sendMessage() {

    const input =
        promptInput.value.trim();


    if (input === "") {
        return;
    }


    /* Show user message */

    addMessage(
        input,
        "user"
    );


    /* Clear input */

    promptInput.value = "";


    /* Show typing */

    showTyping();


    /* Fake thinking delay */

    const delay =
        500 +
        Math.floor(
            Math.random() * 700
        );


    setTimeout(
        function() {

            hideTyping();


            const answer =
                getResponse(
                    input
                );


            addMessage(
                answer,
                "ai"
            );

        },
        delay
    );

}


/* =========================================================
   GET ELEMENTS
========================================================= */

const chat =
    document.getElementById(
        "chat"
    );

const promptInput =
    document.getElementById(
        "promptInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER KEY
========================================================= */

promptInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);

</script>

</body>
</html>
